<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e11d2e">
<title>Conecta</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--tx:#14141a;--mut:#767684;--bd:#ececf0;--pri:#e11d2e;--pri2:#ff5a4d;--soft:#fff0f1;--chip:#f1f1f4;--sh:0 1px 2px #0000000a,0 8px 24px #0000000d;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0c0c10;--card:#16161c;--tx:#f3f3f6;--mut:#9a9aa8;--bd:#25252d;--pri:#ff3347;--pri2:#ff6a5c;--soft:#2a1216;--chip:#22222a;--sh:0 1px 2px #0006;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h2,h3{margin:0}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;text-align:center}
.logo{font-weight:800;font-size:26px;letter-spacing:-.8px;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;display:inline-block}
.logo.big{font-size:40px;display:block;text-align:center}
main{max-width:560px;margin:0 auto;padding:14px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
textarea,input[type=text],input[type=password],input[type=email]{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;font:inherit;background:var(--bg);color:var(--tx)}
textarea{height:64px;resize:none}
textarea:focus,input:focus{outline:2px solid var(--pri);outline-offset:1px}
button{border:0;cursor:pointer;font:inherit;font-weight:600;border-radius:999px;padding:9px 16px;background:var(--chip);color:var(--tx);transition:transform .12s}
button:active{transform:scale(.95)}button:disabled{opacity:.5}
.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mut,small{color:var(--mut);font-size:13px}small{display:block}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.av.big{width:84px;height:84px;font-size:34px;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--pri)}
.who{cursor:pointer}.who b{display:block}
.post p{margin:10px 0;overflow-wrap:anywhere;font-size:16px}
.foto{width:100%;max-height:440px;object-fit:cover;border-radius:14px;display:block;margin-bottom:10px}
.prev{max-width:100%;max-height:150px;border-radius:12px;margin-top:8px}
.like.on{background:var(--soft);color:var(--pri)}
.rp{display:flex;gap:8px;margin-top:10px;font-size:14px}
.rp>div{flex:1;background:var(--bg);padding:8px 12px;border-radius:14px;overflow-wrap:anywhere}.rp .av{width:30px;height:30px;font-size:13px}
.stats{display:flex;gap:8px;margin:12px 0}
.stats button{flex:1;background:var(--chip);border-radius:14px;padding:10px 4px;color:var(--mut);font-size:12px;font-weight:500}
.stats b{display:block;font-size:19px;color:var(--tx)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--pri);color:#fff}
.item{display:flex;align-items:center;gap:10px;padding:8px 0}
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tab button{flex:1;background:none;border-radius:12px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-weight:600}
nav.tab i{font-style:normal;font-size:21px;height:30px;display:flex;align-items:center}
nav.tab button.on{color:var(--pri)}
nav.tab .plus i{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;width:46px;justify-content:center;border-radius:12px;font-size:22px}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:75vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#14141a;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.login{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#7a0a14,#e11d2e 55%,#ff5a4d);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lbox{background:var(--card);border-radius:28px;padding:30px 24px;width:100%;max-width:380px;box-shadow:0 24px 60px #0006}
.lbox input{margin-bottom:10px}.err{color:var(--pri);font-size:13px;min-height:18px;margin-bottom:6px}
.link{color:var(--pri);cursor:pointer;font-weight:600}
.reels{height:calc(100vh - 210px);height:calc(100dvh - 210px);overflow-y:auto;scroll-snap-type:y mandatory;border-radius:20px;scrollbar-width:none}.reels::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden;background-size:300% 300%;animation:flow 12s ease infinite}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ri{position:relative;padding:70px 18px 18px;background:linear-gradient(transparent,#000b)}.ri p{margin:8px 0}.ri small{color:#fffc}
.remo{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-size:100px;animation:flota 3s ease-in-out infinite}
.reel .like{background:#0007;color:#fff}.reel .like.on{background:var(--soft);color:var(--pri)}
@keyframes flow{50%{background-position:100% 50%}}@keyframes flota{50%{transform:translate(-50%,-58%) scale(1.07)}}
</style>
</head>
<body>
<header><span class="logo" onclick="go('feed')">Conecta</span></header>
<main>
  <section class="card" id="comp" hidden>
    <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div id="miav"></div><textarea id="texto" placeholder="¿Qué está pasando?" maxlength="500"></textarea></div>
    <img id="prev" class="prev" hidden alt="">
    <div class="row sp" style="margin-top:8px"><button onclick="$('foto').click()">📷 Foto</button><input type="file" id="foto" accept="image/*" hidden><button class="pri" id="pubb" onclick="pub()">Publicar</button></div>
  </section>
  <div id="app"><div class="card mut">Cargando…</div></div>
</main>
<nav class="tab">
  <button onclick="go('feed')"><i>🏠</i>Inicio</button>
  <button onclick="go('reels')"><i>🎬</i>Reels</button>
  <button class="plus" onclick="crear()"><i>＋</i>Crear</button>
  <button onclick="go('people')"><i>🔎</i>Personas</button>
  <button onclick="go('me')"><i>👤</i>Perfil</button>
</nav>
<div id="modal"></div><div id="toast"></div><div id="login"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== Configuración (claves PÚBLICAS: la seguridad la dan las reglas RLS) ===== */
const SUPABASE_URL='https://fueldnpqipwrbbpgjuca.supabase.co';
const SUPABASE_KEY='sb_publishable_ov6YQYoQnmquLYHeqsjXgg_QodjDvcl';

const COL=['#e11d2e','#f97316','#16a34a','#2563eb','#7c3aed','#0891b2','#db2777','#ca8a04'],$=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=d=>{const m=Math.floor((Date.now()-new Date(d))/6e4);if(m<1)return'ahora';if(m<60)return m+' min';const h=Math.floor(m/60);return h<24?h+' h':Math.floor(h/24)+' d'};
const PR='id,username,name,avatar_url',AU='author:profiles!author_id('+PR+')';
const PS='id,body,image_url,created_at,'+AU;
const RD=[['Camila Torres','camitorres','Atardecer en la costa, sin filtros 🌅','🌅'],['Diego Ramírez','dieguito','El secreto de la provoleta perfecta 🧀','🧀'],['Valentina Gómez','valegomez','Mi rutina de running a las 6 AM 🏃‍♀️','🏃‍♀️'],['Nicolás Pérez','nico_dev','Setup nuevo, a programar 🎮','💻'],['Mateo Álvarez','mateoalv','Probando un riff nuevo 🎸','🎸'],['Martina Díaz','martudiaz','Cinco minutos de yoga para empezar el día 🧘‍♀️','🧘‍♀️'],['Lucas Romero','lucasromero','Mochila lista, destino sorpresa 🎒','✈️'],['Florencia Castro','flor_castro','Mi perro y su truco nuevo 🐶','🐶']];
const GR=['linear-gradient(135deg,#e11d2e,#ff5a4d,#f59e0b)','linear-gradient(135deg,#7a0a14,#e11d2e,#ff8a65)','linear-gradient(135deg,#1d1b3a,#7c3aed,#ec4899)','linear-gradient(135deg,#0f766e,#22c55e,#facc15)','linear-gradient(135deg,#be123c,#fb7185,#fdba74)','linear-gradient(135deg,#111827,#e11d2e,#fb923c)'];
const safeFetch=(u,o)=>{o=o?{...o}:{};if(typeof Headers!=='undefined'&&o.headers instanceof Headers)o.headers=Object.fromEntries(o.headers.entries());return fetch(u,o)};
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{global:{fetch:safeFetch}}):null;

let ME=null,FOL=new Set(),POSTS=[],LK={},CM={},more=false,view={n:'feed'},PF=null,ab={},tab='posts',tok=0,fotoBlob=null,vids=[],IO=null,reg=false,mc=null,PEOPLE=[],qtm;
const RL=(()=>{try{return new Set(JSON.parse(localStorage.getItem('conecta_rl')||'[]'))}catch(e){return new Set()}})();

/* ===== Utilidades ===== */
let tt;function aviso(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}
function err(e){console.error(e);aviso('Algo falló. Probá de nuevo.')}
function safe(u){return typeof u==='string'&&u.startsWith(SUPABASE_URL+'/storage/v1/object/public/media/')?u:''}
function av(u,big){u=u||{};const c=big?' big':'',s=safe(u.avatar_url);
  if(s)return`<img class="av${c}" src="${s}" alt="" decoding="async">`;
  let h=0;for(const ch of String(u.id||''))h=(h*31+ch.charCodeAt(0))>>>0;
  return`<div class="av${c}" style="background:${COL[h%COL.length]}">${E((String(u.name||'?')[0]||'?').toUpperCase())}</div>`}
function red(file,max,qu,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>cb(b),'image/jpeg',qu)};i.src=r.result};r.readAsDataURL(file)}
async function up(blob,name){const path=ME.id+'/'+name+'.jpg',{error}=await sb.storage.from('media').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl}

/* ===== Sesión ===== */
function gate(){const lg=$('login');if(ME){lg.innerHTML='';return}
  lg.innerHTML=`<div class="login"><form class="lbox" onsubmit="event.preventDefault();enviar()"><span class="logo big">Conecta</span><p class="mut" style="text-align:center;margin:4px 0 18px">${reg?'Creá tu cuenta en segundos':'Conectá con personas reales'}</p>${reg?'<input type="text" id="ln" placeholder="Tu nombre" autocomplete="name" maxlength="40">':''}<input type="text" id="lu" placeholder="${reg?'@usuario (letras, números, _ o .)':'Usuario'}" autocapitalize="none" autocomplete="username" maxlength="20"><input type="password" id="lp" placeholder="Contraseña" autocomplete="${reg?'new-password':'current-password'}"><div id="lerr" class="err"></div><button class="pri" id="lb" type="submit" style="width:100%">${reg?'Crear cuenta':'Entrar'}</button><p class="mut" style="text-align:center;margin:14px 0 0"><span class="link" onclick="reg=!reg;gate()">${reg?'Ya tengo cuenta':'Crear una cuenta nueva'}</span></p><p id="diag" class="mut" style="text-align:center;font-size:11px;margin:10px 0 0">Comprobando conexión…</p></form></div>`;diag()}
async function diag(){let m;try{const r=await sb.rpc('username_available',{u:'zz__prueba'});m=r.error?'Conexión: ERROR ('+(r.error.message||r.error.code)+')':'Conexión con la base: OK'}catch(e){m='Conexión: ERROR ('+(e.message||e)+')'}const x=$('diag');if(x)x.textContent=m}
function er(m){const e=$('lerr');if(e)e.textContent=m}
const MAILD='@conecta.app';
async function enviar(){const user=$('lu').value.trim().toLowerCase().replace(/^@/,''),pass=$('lp').value,b=$('lb'),email=user+MAILD;
  if(!/^[a-z0-9_.]{1,20}$/.test(user))return er('Usuario: letras, números, _ o . (máx. 20)');
  if(!pass)return er('Escribí tu contraseña');
  b.disabled=true;er('');
  try{
    if(reg){const name=$('ln').value.trim();
      if(!name)return er('Escribí tu nombre');
      const a=await sb.rpc('username_available',{u:user});if(a.error)throw a.error;if(!a.data)return er('Ese @usuario ya existe');
      const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name,username:user}}});
      if(error)return er(/registered|exists/i.test(error.message)?'Ese usuario ya existe':'Error: '+error.message);
      if(data.user&&data.user.identities&&data.user.identities.length===0)return er('Ese usuario ya existe');
      if(!data.session){reg=false;gate();er('Cuenta creada, pero Supabase pide confirmar el correo. Desactivá Confirm email en Authentication y probá de nuevo.');return}
      return await entrar(data.user)}
    const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)return er(/confirm/i.test(error.message)?'Esta cuenta pide confirmación: desactivá Confirm email en Supabase':/invalid login/i.test(error.message)?'Usuario o contraseña incorrectos':'Error: '+error.message);
    await entrar(data.user)
  }catch(e){console.error(e);er('No se pudo conectar: '+(e&&e.message||e))}finally{const x=$('lb');if(x)x.disabled=false}}
async function entrar(user){
  const p=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(p.error||!p.data){await sb.auth.signOut();return er('No se encontró tu perfil. Contactá al administrador.')}
  ME=p.data;const f=await sb.from('follows').select('followee_id').eq('follower_id',ME.id);FOL=new Set((f.data||[]).map(x=>x.followee_id));
  gate();$('miav').innerHTML=av(ME);go('feed')}
async function salir(){await sb.auth.signOut();ME=null;FOL=new Set();POSTS=[];reg=false;gate()}

/* ===== Navegación ===== */
function go(n,id){if(!ME)return;if(n==='me'){n='profile';id=ME.id}view=n==='profile'?{n,id}:{n};cerrarM();tab='posts';$('comp').hidden=n!=='feed';nav();load();scrollTo(0,0)}
function openP(id){go('profile',id)}
function crear(){go('feed');$('texto').focus()}
function nav(){const b=document.querySelectorAll('nav.tab button'),k=view.n==='feed'?0:view.n==='reels'?1:view.n==='people'?3:(view.n==='profile'&&view.id===ME.id)?4:-1;b.forEach((x,i)=>x.classList.toggle('on',i===k))}
async function load(){const t=++tok;$('app').innerHTML='<div class="card mut">Cargando…</div>';
  try{
    if(view.n==='feed'){const r=await getPosts();if(t!==tok)return;POSTS=r;await hyd(POSTS);if(t!==tok)return;more=POSTS.length===20;render()}
    else if(view.n==='people'){render();searchP('')}
    else if(view.n==='reels'){render()}
    else{const p=await getProfile(view.id);if(t!==tok)return;PF=p;render()}
  }catch(e){err(e);if(t===tok)$('app').innerHTML='<div class="card mut">No se pudo cargar. Tocá Inicio para reintentar.</div>'}}

/* ===== Datos ===== */
async function getPosts(before){let q=sb.from('posts').select(PS).order('created_at',{ascending:false}).limit(20);if(before)q=q.lt('created_at',before);const{data,error}=await q;if(error)throw error;return data||[]}
async function hyd(list){const ids=list.map(p=>p.id);if(!ids.length)return;
  const[l,c]=await Promise.all([sb.from('likes').select('post_id,user_id').in('post_id',ids),sb.from('comments').select('id,post_id,body,created_at,'+AU).in('post_id',ids).order('created_at')]);
  if(l.error)throw l.error;if(c.error)throw c.error;
  ids.forEach(i=>{LK[i]={n:0,me:false};CM[i]=[]});
  l.data.forEach(x=>{const k=LK[x.post_id];if(k){k.n++;if(x.user_id===ME.id)k.me=true}});c.data.forEach(x=>{if(CM[x.post_id])CM[x.post_id].push(x)})}
async function cnt(tbl,col,id){const r=await sb.from(tbl).select('*',{count:'exact',head:true}).eq(col,id);return r.count||0}
async function getProfile(id){
  const[p,fo,fi,np]=await Promise.all([sb.from('profiles').select('*').eq('id',id).single(),cnt('follows','followee_id',id),cnt('follows','follower_id',id),cnt('posts','author_id',id)]);
  if(p.error)throw p.error;let list=[];
  if(tab==='posts'){const r=await sb.from('posts').select(PS).eq('author_id',id).order('created_at',{ascending:false}).limit(20);if(r.error)throw r.error;list=r.data}
  else{const r=await sb.from('likes').select('post:posts('+PS+')').eq('user_id',id).order('created_at',{ascending:false}).limit(20);if(r.error)throw r.error;list=r.data.map(x=>x.post).filter(Boolean)}
  await hyd(list);return{p:p.data,fo,fi,np,list}}

/* ===== Vistas ===== */
function cmH(id){return(CM[id]||[]).map(c=>`<div class="rp"><span class="who" onclick="openP('${c.author.id}')">${av(c.author)}</span><div><b>${E(c.author.name)}</b> ${E(c.body)}<small>${T(c.created_at)}</small></div></div>`).join('')+`<div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="text" id="c${id}" placeholder="Escribí una respuesta…" maxlength="300" onkeydown="if(event.key==='Enter')cmt('${id}')"><button class="pri" onclick="cmt('${id}')">Enviar</button></div>`}
function postH(p){const a=p.author||{},l=LK[p.id]||{n:0,me:false},n=(CM[p.id]||[]).length,img=safe(p.image_url);
  return`<article class="card post" id="p${p.id}"><div class="row sp" style="flex-wrap:nowrap"><div class="row who" onclick="openP('${a.id}')" style="flex-wrap:nowrap">${av(a)}<div><b>${E(a.name)}</b><small>@${E(a.username)} · ${T(p.created_at)}</small></div></div>${a.id===ME.id?`<button onclick="delP('${p.id}')" aria-label="Borrar">🗑</button>`:''}</div>${p.body?`<p>${E(p.body)}</p>`:''}${img?`<img class="foto" src="${img}" alt="" loading="lazy" decoding="async">`:''}<div class="row"><button class="like${l.me?' on':''}" data-lk="${p.id}" onclick="like('${p.id}')">♥ ${l.n}</button><button onclick="tg('${p.id}')">💬 ${n}</button></div>${ab[p.id]?cmH(p.id):''}</article>`}
function rowH(u){const sig=FOL.has(u.id);return`<div class="item"><div class="row who" style="flex:1;flex-wrap:nowrap" onclick="openP('${u.id}')">${av(u)}<div><b>${E(u.name)}</b><small>@${E(u.username)}</small></div></div>${u.id===ME.id?'':`<button class="${sig?'':'pri'}" data-fl="${u.id}" onclick="seguir('${u.id}')">${sig?'Siguiendo':'Seguir'}</button>`}</div>`}
function reelsH(){return`<div class="row sp" style="margin-bottom:10px"><div><h2>Reels</h2><small>Reels de ejemplo</small></div><span><button class="pri" onclick="$('vid').click()">+ Subir video</button><input type="file" id="vid" accept="video/*" hidden onchange="subirV(event)"></span></div><div class="reels">${vids.map(v=>`<section class="reel" style="background:#000"><video src="${v.u}" loop muted playsinline preload="metadata" onclick="this.paused?this.play():this.pause()"></video><div class="ri"><div class="row who" onclick="go('me')" style="flex-wrap:nowrap">${av(ME)}<b>${E(ME.name)}</b></div><p>${E(v.t)}</p></div></section>`).join('')}${RD.map((d,i)=>{const id='rl'+i;return`<section class="reel" style="background-image:${GR[i%6]}" ondblclick="likeR('${id}')"><div class="remo">${d[3]}</div><div class="ri"><b>${E(d[0])}</b><small>@${E(d[1])}</small><p>${E(d[2])}</p><button class="like${RL.has(id)?' on':''}" data-lr="${id}" onclick="likeR('${id}')">♥ Me gusta</button></div></section>`}).join('')}</div>`}
function obs(){if(IO)IO.disconnect();IO=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(v)e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.6});document.querySelectorAll('.reel').forEach(r=>IO.observe(r))}
function render(){const a=$('app');
  if(view.n==='reels'){a.innerHTML=reelsH();obs();return}
  if(view.n==='people'){a.innerHTML=`<div class="card"><input type="text" id="qs" placeholder="Buscar por nombre o @usuario…" maxlength="30" oninput="clearTimeout(qtm);qtm=setTimeout(()=>searchP(this.value),300)"></div><div id="plist"></div>`;plist();return}
  if(view.n==='feed'){a.innerHTML='<button id="newb" class="pri" hidden style="width:100%;margin-bottom:10px" onclick="load()"></button>'+(POSTS.map(postH).join('')||'<div class="card mut">Todavía no hay publicaciones. ¡Sé el primero!</div>')+(more?'<button class="pri" style="width:100%" onclick="moreP()">Ver más</button>':'');return}
  const{p,fo,fi,np,list}=PF,mio=p.id===ME.id;
  a.innerHTML=`<section class="card"><div class="row" style="flex-wrap:nowrap">${av(p,1)}<div><h2>${E(p.name)}</h2><span class="mut">@${E(p.username)}</span></div></div><p>${E(p.bio)}</p><div class="stats"><button><b>${np}</b>Publicaciones</button><button onclick="lista('s','${p.id}')"><b>${fo}</b>Seguidores</button><button onclick="lista('f','${p.id}')"><b>${fi}</b>Seguidos</button></div>${mio?`<div class="row"><button onclick="$('avf').click()">Cambiar foto</button><button onclick="edit()">Editar perfil</button><button onclick="salir()">Salir</button><input type="file" id="avf" accept="image/*" hidden onchange="cfoto(event)"></div>`:`<button class="${FOL.has(p.id)?'':'pri'}" data-fl="${p.id}" onclick="seguir('${p.id}')">${FOL.has(p.id)?'Siguiendo ✓':'Seguir'}</button>`}</section><div class="tabs"><button class="${tab==='posts'?'on':''}" onclick="tab='posts';load()">Publicaciones</button><button class="${tab==='likes'?'on':''}" onclick="tab='likes';load()">Me gusta</button></div>`+(list.map(postH).join('')||'<div class="card mut">Nada por acá todavía.</div>')}
function plist(){const e=$('plist');if(e)e.innerHTML=PEOPLE.map(u=>`<div class="card" style="padding:8px 14px;margin-bottom:8px">${rowH(u)}</div>`).join('')||'<div class="card mut">Sin resultados.</div>'}
async function searchP(q){const t=tok;let r=sb.from('profiles').select(PR+',bio').neq('id',ME.id).order('created_at',{ascending:false}).limit(30);
  q=(q||'').replace(/[%,()*"\\]/g,' ').trim();if(q)r=r.or(`username.ilike.%${q}%,name.ilike.%${q}%`);
  const{data,error}=await r;if(error)return err(error);if(t!==tok)return;PEOPLE=data;plist()}
async function lista(t,id){mc=1;const q=t==='s'?sb.from('follows').select('u:profiles!follower_id('+PR+')').eq('followee_id',id):sb.from('follows').select('u:profiles!followee_id('+PR+')').eq('follower_id',id);
  const{data,error}=await q.limit(100);if(error)return err(error);const us=data.map(x=>x.u).filter(Boolean);
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)cerrarM()"><div class="sheet"><div class="row sp"><h3>${t==='s'?'Seguidores':'Seguidos'} · ${us.length}</h3><button onclick="cerrarM()">✕</button></div>${us.map(rowH).join('')||'<p class="mut">Nadie por acá todavía.</p>'}</div></div>`}
function cerrarM(){mc=null;$('modal').innerHTML=''}

/* ===== Acciones ===== */
async function moreP(){try{const r=await getPosts(POSTS[POSTS.length-1].created_at);await hyd(r);POSTS=POSTS.concat(r);more=r.length===20;render()}catch(e){err(e)}}
function tg(id){ab[id]=!ab[id];const el=$('p'+id);if(el){const i=POSTS.concat(PF?PF.list:[]).find(p=>p.id===id);if(i)el.outerHTML=postH(i)}}
async function like(id){const l=LK[id]||(LK[id]={n:0,me:false}),was=l.me;l.me=!was;l.n+=was?-1:1;upLk(id);
  const r=was?await sb.from('likes').delete().eq('user_id',ME.id).eq('post_id',id):await sb.from('likes').insert({user_id:ME.id,post_id:id});
  if(r.error){l.me=was;l.n+=was?1:-1;upLk(id);err(r.error)}}
function upLk(id){document.querySelectorAll('[data-lk="'+id+'"]').forEach(b=>{b.classList.toggle('on',LK[id].me);b.textContent='♥ '+LK[id].n})}
async function cmt(id){const i=$('c'+id),t=i&&i.value.trim();if(!t)return;i.disabled=true;
  const{data,error}=await sb.from('comments').insert({post_id:id,author_id:ME.id,body:t.slice(0,300)}).select('id,post_id,body,created_at,'+AU).single();
  if(error){i.disabled=false;return err(error)}(CM[id]=CM[id]||[]).push(data);const p=POSTS.concat(PF?PF.list:[]).find(x=>x.id===id),el=$('p'+id);if(p&&el)el.outerHTML=postH(p)}
async function seguir(id){const was=FOL.has(id);was?FOL.delete(id):FOL.add(id);
  document.querySelectorAll('[data-fl="'+id+'"]').forEach(b=>{b.className=FOL.has(id)?'':'pri';b.textContent=FOL.has(id)?(view.n==='profile'?'Siguiendo ✓':'Siguiendo'):'Seguir'});
  const r=was?await sb.from('follows').delete().eq('follower_id',ME.id).eq('followee_id',id):await sb.from('follows').insert({follower_id:ME.id,followee_id:id});
  if(r.error){was?FOL.add(id):FOL.delete(id);err(r.error);if(view.n!=='feed')render();return}
  if(view.n==='profile'&&PF){PF.fo+=was?-1:1;if(PF.p.id===id&&!mc)render()}}
async function delP(id){if(!confirm('¿Borrar esta publicación?'))return;const p=POSTS.concat(PF?PF.list:[]).find(x=>x.id===id),r=await sb.from('posts').delete().eq('id',id);if(r.error)return err(r.error);
  const s=p&&safe(p.image_url);if(s)sb.storage.from('media').remove([s.split('/media/')[1]]);POSTS=POSTS.filter(x=>x.id!==id);if(PF){PF.list=PF.list.filter(x=>x.id!==id);PF.np=Math.max(0,PF.np-1)}render()}
$('foto').onchange=e=>{const f=e.target.files[0];if(!f)return;red(f,720,.7,b=>{fotoBlob=b;const p=$('prev');p.src=URL.createObjectURL(b);p.hidden=false});e.target.value=''};
async function pub(){const t=$('texto').value.trim();if(!t&&!fotoBlob)return aviso('Escribí algo o subí una foto');const b=$('pubb');b.disabled=true;
  try{let url=null;if(fotoBlob)url=await up(fotoBlob,Date.now()+'-'+Math.random().toString(36).slice(2,6));
    const{data,error}=await sb.from('posts').insert({author_id:ME.id,body:t,image_url:url}).select(PS).single();if(error)throw error;
    POSTS.unshift(data);LK[data.id]={n:0,me:false};CM[data.id]=[];$('texto').value='';fotoBlob=null;$('prev').hidden=true;if(view.n==='feed')render()}
  catch(e){err(e)}b.disabled=false}
async function edit(){const n=prompt('Nombre:',ME.name);if(n===null)return;const b=prompt('Biografía:',ME.bio);if(b===null)return;
  const{data,error}=await sb.from('profiles').update({name:(n.trim()||ME.name).slice(0,40),bio:b.trim().slice(0,150)}).eq('id',ME.id).select('*').single();if(error)return err(error);ME=data;$('miav').innerHTML=av(ME);load()}
function cfoto(e){const f=e.target.files[0];if(!f)return;red(f,200,.8,async b=>{try{const url=await up(b,'avatar-'+Date.now()),{data,error}=await sb.from('profiles').update({avatar_url:url}).eq('id',ME.id).select('*').single();if(error)throw error;ME=data;$('miav').innerHTML=av(ME);load()}catch(x){err(x)}})}
function likeR(id){RL.has(id)?RL.delete(id):RL.add(id);try{localStorage.setItem('conecta_rl',JSON.stringify([...RL]))}catch(e){}document.querySelectorAll('[data-lr="'+id+'"]').forEach(b=>b.classList.toggle('on',RL.has(id)))}
function subirV(e){const f=e.target.files[0];if(!f)return;vids.unshift({u:URL.createObjectURL(f),t:prompt('Descripción de tu reel:','')||''});render();aviso('Reel subido (dura mientras la página esté abierta)')}

/* ===== Aviso de publicaciones nuevas (consulta liviana cada 45 s) ===== */
setInterval(async()=>{if(!ME||document.hidden||view.n!=='feed'||!POSTS.length)return;
  const{count}=await sb.from('posts').select('id',{count:'exact',head:true}).gt('created_at',POSTS[0].created_at),b=$('newb');
  if(b&&count>0){b.textContent='↑ '+count+' publicación'+(count>1?'es nuevas':' nueva');b.hidden=false}},45000);

/* ===== Inicio ===== */
(async function boot(){
  if(!sb){$('app').innerHTML='<div class="card">No se pudo cargar Supabase. Revisá tu conexión.</div>';return}
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&ME){ME=null;gate()}});
  try{const{data:{session}}=await sb.auth.getSession();if(session)await entrar(session.user);else{$('app').innerHTML='';gate()}}
  catch(e){console.error(e);$('app').innerHTML='';gate()}})();
</script>
</body>
